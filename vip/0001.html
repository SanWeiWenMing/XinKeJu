<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会员信息</title>
<style>
.card{max-width:400px;margin:20px auto;border:1px solid #ccc;border-radius:16px;padding:24px}
.avatar{width:120px;height:120px;object-fit:cover;border-radius:8px;margin:0 auto;display:block}
.item{margin:12px 0;font-size:16px}
.label{color:#666}
.valid{color:green;font-weight:bold}
.expired{color:red;font-weight:bold}
</style>
</head>
<body>
<div class="card">
  <img class="avatar" src="./photo0001.jpg">
  <div class="item"><span class="label">姓名：</span>张三</div>
  <div class="item"><span class="label">性别：</span>男</div>
  <div class="item"><span class="label">年龄：</span>13岁</div>
  <div class="item"><span class="label">学校：</span>XX中学</div>
  <div class="item"><span class="label">生效日期：</span>2026-01-01</div>
  <div class="item"><span class="label">截止日期：</span>2026-02-01</div>
  <div class="item valid">会员状态：正常有效</div>
</div>
</body>
</html>
